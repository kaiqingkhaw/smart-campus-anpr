name: Import and verify source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack reviewed source
        run: |
          echo '3349287329e801283cd60d398c2ef4c640b8591f36b781643290ea97b947c9e6  source-bundle.zip' | sha256sum -c -
          unzip -o source-bundle.zip -x '.github/*'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile and test
        run: |
          python -m compileall -q Python_Code
          python -m pytest -q
      - name: Commit verified source and remove transfer archive
        run: |
          git rm source-bundle.zip
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import reviewed ANPR source with 35 passing regression cases'
          git push origin HEAD:main
