name: Import and verify source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify and unpack reviewed source
        run: |
          echo '6a582e4af52fdec707c5c8c43d6c5560fddb0d16b0e9f06c76ef0a001fabcb82  source-bundle.zip' | sha256sum -c -
          unzip -o source-bundle.zip -x '.github/*'
          git rm --ignore-unmatch IMPROVEMENTS.md docs/PORTFOLIO.md docs/PUBLISH.md Python_Code/static/img/mmu_logo.png Python_Code/static/img/mmu_campus_bg.png
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile and test
        run: |
          python -m compileall -q Python_Code
          python -m pytest -q
      - name: Publish reviewed changes
        run: |
          git rm source-bundle.zip
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Simplify project documentation and align recognition checks'
          git push origin HEAD:main
