name: Restore submitted interface
on: [push]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore reviewed interface files
        run: |
          python - <<'PY'
          import base64, io, zipfile, hashlib
          data = base64.b64decode('')
          assert hashlib.sha256(data).hexdigest() == '591311cc56e7ff26b37039916d993ebd321e436a12b070bf01912d52528d9c64'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall('.')
          PY
          git restore --source=806c084 -- Python_Code/static/img/mmu_logo.png Python_Code/static/img/mmu_campus_bg.png
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Commit restored design
        run: |
          git add Python_Code README.md tests
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore submitted dashboard design'
          git push origin HEAD:main
