<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 - Server Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-bg">
  <main class="container py-5 min-vh-100 d-flex align-items-center justify-content-center">
    <section class="error-panel text-center">
      <div class="error-icon"><i class="bi bi-tools"></i></div>
      <div class="error-code">Error 500</div>
      <h1>Internal Server Error</h1>
      <p>The dashboard could not process the request. Please return to the dashboard and try again.</p>
      <a class="btn btn-primary" href="{{ url_for('dashboard') }}"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
    </section>
  </main>
</body>
</html>
